<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MarketFlow - Mercado Pino Suárez</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class' };</script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- jsPDF + AutoTable para exportar PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
            transition: background-color 0.3s, color 0.3s;
        }

        /* Dark mode smooth transitions */
        aside,
        header,
        nav,
        main,
        #modal-content {
            transition: background-color 0.3s, border-color 0.3s, color 0.3s;
        }

        .custom-scroll::-webkit-scrollbar {
            width: 4px;
        }

        .custom-scroll::-webkit-scrollbar-track {
            background: #f1f1f1;
        }

        .custom-scroll::-webkit-scrollbar-thumb {
            background: #10b981;
            border-radius: 10px;
        }

        .view-animate {
            animation: slideUp 0.3s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Estilo para simular las imágenes flat de nano banana */
        .product-art {
            background: linear-gradient(135deg, #ecfdf5 0%, #d1fae5 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .product-art::after {
            content: '';
            position: absolute;
            width: 150%;
            height: 150%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.4) 0%, rgba(255, 255, 255, 0) 70%);
            top: -50%;
            left: -50%;
        }

        /* ===== TICKET / RECIBO TÉRMICO ===== */
        .ticket-paper {
            font-family: 'Courier New', Courier, monospace;
            background-color: #fff;
            color: #111;
            letter-spacing: 0.01em;
        }

        .ticket-divider {
            border: none;
            border-top: 1px dashed #999;
            margin: 10px 0;
        }

        .ticket-row {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            line-height: 1.6;
        }

        .ticket-row.header-row {
            font-weight: 700;
        }

        .ticket-total-row {
            display: flex;
            justify-content: space-between;
            font-size: 16px;
            font-weight: 900;
            margin: 6px 0;
        }

        @media print {
            .no-print {
                display: none !important;
            }

            body>*:not(#print-ticket-wrapper) {
                display: none !important;
            }

            #print-ticket-wrapper {
                display: block !important;
                width: 280px;
                margin: 0 auto;
            }
        }
    </style>
</head>

<body class="bg-slate-50 text-slate-900 min-h-screen pb-20 md:pb-0 dark:bg-slate-900 dark:text-slate-100">

    <!-- SIDEBAR (Escritorio) -->
    <aside class="hidden md:flex flex-col w-64 bg-emerald-950 text-white fixed h-full left-0 top-0 z-50">
        <div class="p-8">
            <div class="flex items-center gap-3 mb-10">
                <div class="bg-emerald-500 p-2 rounded-2xl shadow-lg shadow-emerald-500/20">
                    <i data-lucide="shopping-bag" class="w-6 h-6 text-white"></i>
                </div>
                <h1 class="text-xl font-extrabold tracking-tight">MarketFlow</h1>
            </div>

            <nav class="space-y-2">
                <button onclick="app.showView('pos')" id="nav-pos"
                    class="nav-btn w-full flex items-center gap-3 p-3.5 rounded-2xl transition-all hover:bg-emerald-800 text-emerald-100/70">
                    <i data-lucide="layout-grid" class="w-5 h-5"></i>
                    <span class="font-bold text-sm">Ventas</span>
                </button>
                <button onclick="app.showView('inventory')" id="nav-inventory"
                    class="nav-btn w-full flex items-center gap-3 p-3.5 rounded-2xl transition-all hover:bg-emerald-800 text-emerald-100/70">
                    <i data-lucide="package" class="w-5 h-5"></i>
                    <span class="font-bold text-sm">Inventario</span>
                </button>
                <button onclick="app.showView('reports')" id="nav-reports"
                    class="nav-btn w-full flex items-center gap-3 p-3.5 rounded-2xl transition-all hover:bg-emerald-800 text-emerald-100/70">
                    <i data-lucide="bar-chart-3" class="w-5 h-5"></i>
                    <span class="font-bold text-sm">Corte Diario</span>
                </button>
                <button onclick="app.showView('tickets')" id="nav-tickets"
                    class="nav-btn w-full flex items-center gap-3 p-3.5 rounded-2xl transition-all hover:bg-emerald-800 text-emerald-100/70">
                    <i data-lucide="receipt" class="w-5 h-5"></i>
                    <span class="font-bold text-sm">Historial Tickets</span>
                </button>
                <button onclick="app.showView('profile')" id="nav-profile"
                    class="nav-btn w-full flex items-center gap-3 p-3.5 rounded-2xl transition-all hover:bg-emerald-800 text-emerald-100/70">
                    <i data-lucide="user" class="w-5 h-5"></i>
                    <span class="font-bold text-sm">Mi Perfil</span>
                </button>
            </nav>
        </div>

        <div class="mt-auto p-6 border-t border-emerald-900 bg-emerald-950/50">
            <div class="flex items-center gap-3 mb-4">
                <div id="sidebar-avatar"
                    class="w-10 h-10 rounded-2xl bg-emerald-500 flex items-center justify-center font-black text-white shadow-lg shadow-emerald-500/20 uppercase">
                    EZ</div>
                <div class="flex-1 min-w-0">
                    <p id="sidebar-biz-name" class="text-sm font-bold truncate">Cargando...</p>
                    <p class="text-[10px] text-emerald-400 font-bold uppercase tracking-widest">Locatario</p>
                </div>
            </div>
            <div class="flex items-center justify-between">
                <button onclick="app.reset()"
                    class="flex items-center gap-2 text-xs font-bold text-emerald-300 hover:text-white transition">
                    <i data-lucide="log-out" class="w-4 h-4"></i> Cerrar Sesión
                </button>
                <button onclick="app.toggleDark()" id="dark-toggle-sidebar"
                    class="p-2 rounded-xl bg-emerald-900 hover:bg-emerald-800 transition-all text-emerald-300 hover:text-white">
                    <i data-lucide="moon" class="w-4 h-4" id="dark-icon-sidebar"></i>
                </button>
            </div>
        </div>
    </aside>

    <!-- HEADER (Móvil) -->
    <header
        class="md:hidden bg-emerald-950 text-white p-4 flex justify-between items-center sticky top-0 z-40 shadow-xl no-print">
        <div class="flex items-center gap-2">
            <div class="bg-emerald-500 p-1.5 rounded-xl">
                <i data-lucide="shopping-bag" class="w-5 h-5 text-white"></i>
            </div>
            <span class="font-black text-lg tracking-tight">MarketFlow</span>
        </div>
        <div class="flex items-center gap-2">
            <button onclick="app.toggleDark()" id="dark-toggle-mobile"
                class="bg-emerald-800 w-10 h-10 rounded-2xl flex items-center justify-center border border-emerald-700 shadow-lg shadow-black/20">
                <i data-lucide="moon" class="w-5 h-5" id="dark-icon-mobile"></i>
            </button>
            <button onclick="app.showView('profile')"
                class="bg-emerald-800 w-10 h-10 rounded-2xl flex items-center justify-center border border-emerald-700 shadow-lg shadow-black/20">
                <i data-lucide="user" class="w-5 h-5"></i>
            </button>
        </div>
    </header>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="md:ml-64 p-4 md:p-8 no-print pb-24 md:pb-8 dark:bg-slate-900" id="view-container">
        <!-- Vistas dinámicas -->
    </main>

    <!-- NAVEGACIÓN INFERIOR (Móvil) -->
    <nav
        class="md:hidden fixed bottom-0 left-0 right-0 bg-white dark:bg-slate-800 border-t border-slate-100 dark:border-slate-700 flex justify-around p-3 z-50 shadow-[0_-5px_20px_rgba(0,0,0,0.05)] no-print">
        <button onclick="app.showView('pos')" class="flex flex-col items-center gap-1 text-emerald-600">
            <i data-lucide="layout-grid" class="w-6 h-6"></i>
            <span class="text-[10px] font-bold uppercase tracking-tighter">Ventas</span>
        </button>
        <button onclick="app.showView('inventory')"
            class="flex flex-col items-center gap-1 text-slate-400 dark:text-slate-400">
            <i data-lucide="package" class="w-6 h-6"></i>
            <span class="text-[10px] font-bold uppercase tracking-tighter">Stock</span>
        </button>
        <button onclick="app.showView('reports')"
            class="flex flex-col items-center gap-1 text-slate-400 dark:text-slate-400">
            <i data-lucide="bar-chart-3" class="w-6 h-6"></i>
            <span class="text-[10px] font-bold uppercase tracking-tighter">Corte</span>
        </button>
        <button onclick="app.showView('tickets')"
            class="flex flex-col items-center gap-1 text-slate-400 dark:text-slate-400">
            <i data-lucide="receipt" class="w-6 h-6"></i>
            <span class="text-[10px] font-bold uppercase tracking-tighter">Tickets</span>
        </button>
        <button onclick="app.showView('profile')"
            class="flex flex-col items-center gap-1 text-slate-400 dark:text-slate-400">
            <i data-lucide="user" class="w-6 h-6"></i>
            <span class="text-[10px] font-bold uppercase tracking-tighter">Perfil</span>
        </button>
    </nav>

    <!-- MODAL -->
    <div id="modal-overlay"
        class="fixed inset-0 bg-slate-900/60 backdrop-blur-md z-[60] hidden flex items-center justify-center p-4">
        <div id="modal-content"
            class="bg-white dark:bg-slate-800 rounded-[2.5rem] w-full max-w-md shadow-2xl overflow-hidden animate-in fade-in zoom-in duration-300">
            <!-- Contenido dinámico -->
        </div>
    </div>

    <script>
        /**
         * DB Y PERSISTENCIA
         */
        const DB_VERSION = '4';
        const DB = {
            KEYS: { PRODUCTS: 'mf_products', SALES: 'mf_sales', PROFILE: 'mf_profile' },
            _defaultProducts: [
                // — LÁCTEOS —
                { id: 1, name: 'Queso Sopero Tabasco (kg)', price: 145, stock: 20, category: 'Lácteos', icon: 'cheese' },
                { id: 2, name: 'Queso de Hoja (pza)', price: 180, stock: 15, category: 'Lácteos', icon: 'cheese' },
                { id: 3, name: 'Crema Agria (litro)', price: 60, stock: 30, category: 'Lácteos', icon: 'droplets' },
                // — BEBIDAS —
                { id: 4, name: 'Horchata de Arroz 1L', price: 35, stock: 50, category: 'Bebidas', icon: 'cup-soda' },
                { id: 5, name: 'Pozol de Cacao 1L', price: 25, stock: 40, category: 'Bebidas', icon: 'coffee' },
                { id: 6, name: 'Agua de Jamaica 1L', price: 20, stock: 35, category: 'Bebidas', icon: 'glass-water' },
                // — EMBUTIDOS —
                { id: 7, name: 'Butifarras Jalpa (orden)', price: 95, stock: 15, category: 'Embutidos', icon: 'utensils' },
                { id: 8, name: 'Longaniza Tabasqueña (kg)', price: 120, stock: 20, category: 'Embutidos', icon: 'utensils' },
                { id: 9, name: 'Chorizo Tabasqueño (kg)', price: 110, stock: 18, category: 'Embutidos', icon: 'utensils' },
                // — PESCADOS Y MARISCOS —
                { id: 10, name: 'Pejelagarto en Chile (kg)', price: 220, stock: 10, category: 'Pescados', icon: 'fish' },
                { id: 11, name: 'Mojarra Fresca (kg)', price: 90, stock: 25, category: 'Pescados', icon: 'fish' },
                { id: 12, name: 'Camarón de Río (kg)', price: 150, stock: 12, category: 'Mariscos', icon: 'shell' },
                // — VERDURAS Y HIERBAS —
                { id: 13, name: 'Chile Amashito (bolsa)', price: 15, stock: 60, category: 'Verduras', icon: 'flame' },
                { id: 14, name: 'Hierba Santa / Momo (mano)', price: 10, stock: 80, category: 'Verduras', icon: 'leaf' },
                { id: 15, name: 'Chipilín (mano)', price: 10, stock: 70, category: 'Verduras', icon: 'leaf' },
                { id: 16, name: 'Chaya (mano)', price: 12, stock: 60, category: 'Verduras', icon: 'leaf' },
                // — FRUTAS —
                { id: 17, name: 'Plátano Macho (kg)', price: 22, stock: 100, category: 'Frutas', icon: 'banana' },
                { id: 18, name: 'Mamey (pza)', price: 35, stock: 30, category: 'Frutas', icon: 'apple' },
                { id: 19, name: 'Guanábana (kg)', price: 40, stock: 20, category: 'Frutas', icon: 'apple' },
                { id: 20, name: 'Marañón (kg)', price: 55, stock: 25, category: 'Frutas', icon: 'apple' },
                // — ABARROTES —
                { id: 21, name: 'Frijol Negro (kg)', price: 28, stock: 80, category: 'Abarrotes', icon: 'package' },
                { id: 22, name: 'Arroz (kg)', price: 20, stock: 100, category: 'Abarrotes', icon: 'package' },
                { id: 23, name: 'Cacao en Grano (100g)', price: 45, stock: 40, category: 'Abarrotes', icon: 'package' },
                { id: 24, name: 'Chocolate de Metate (tab)', price: 65, stock: 30, category: 'Abarrotes', icon: 'square' },
                // — CARNICERÍA —
                { id: 25, name: 'Carne de Res (kg)', price: 180, stock: 30, category: 'Carnicería', icon: 'beef' },
                { id: 26, name: 'Tasajo (kg)', price: 160, stock: 20, category: 'Carnicería', icon: 'beef' },
            ],
            init() {
                // Migración: forzar nuevos productos si es versión anterior
                if (localStorage.getItem('mf_version') !== DB_VERSION) {
                    localStorage.setItem(this.KEYS.PRODUCTS, JSON.stringify(this._defaultProducts));
                    localStorage.setItem('mf_version', DB_VERSION);
                }
                if (!localStorage.getItem(this.KEYS.SALES)) localStorage.setItem(this.KEYS.SALES, '[]');
                if (!localStorage.getItem(this.KEYS.PROFILE)) {
                    localStorage.setItem(this.KEYS.PROFILE, JSON.stringify({
                        name: 'Elian Zurita',
                        business: 'Novedades Elian',
                        phone: '9931234567',
                        location: 'Mercado Pino Suárez, Villahermosa'
                    }));
                }
            },
            get(key) { return JSON.parse(localStorage.getItem(key)); },
            save(key, data) { localStorage.setItem(key, JSON.stringify(data)); }
        };

        /**
         * APP CORE
         */
        const app = {
            cart: [],
            currentView: '',



            init() {
                DB.init();
                this.syncProfile();
                // Restaurar modo oscuro
                if (localStorage.getItem('mf_dark') === '1') {
                    document.documentElement.classList.add('dark');
                    this._updateDarkIcons(true);
                }
                this.showView('pos');
                lucide.createIcons();
            },

            syncProfile() {
                const p = DB.get(DB.KEYS.PROFILE);
                document.getElementById('sidebar-biz-name').innerText = p.business;
                document.getElementById('sidebar-avatar').innerText = p.name.substring(0, 2).toUpperCase();
            },

            showView(view) {
                if (this.currentView === view && view !== 'pos') return;
                this.currentView = view;
                const container = document.getElementById('view-container');
                container.innerHTML = '';

                const wrapper = document.createElement('div');
                wrapper.className = 'view-animate';

                // Actualizar Botones Nav
                document.querySelectorAll('.nav-btn').forEach(btn => {
                    btn.classList.remove('bg-emerald-800', 'text-white');
                    btn.classList.add('text-emerald-100/70');
                });
                const activeBtn = document.getElementById(`nav-${view}`);
                if (activeBtn) {
                    activeBtn.classList.add('bg-emerald-800', 'text-white');
                    activeBtn.classList.remove('text-emerald-100/70');
                }

                switch (view) {
                    case 'pos': this.renderPOS(wrapper); break;
                    case 'inventory': this.renderInventory(wrapper); break;
                    case 'reports': this.renderReports(wrapper); break;
                    case 'tickets': this.renderTicketHistory(wrapper); break;
                    case 'profile': this.renderProfile(wrapper); break;
                }
                container.appendChild(wrapper);
                lucide.createIcons();
            },

            // --- DARK MODE ---
            toggleDark() {
                const isDark = document.documentElement.classList.toggle('dark');
                localStorage.setItem('mf_dark', isDark ? '1' : '0');
                this._updateDarkIcons(isDark);
                lucide.createIcons();
            },

            _updateDarkIcons(isDark) {
                ['dark-icon-sidebar', 'dark-icon-mobile'].forEach(id => {
                    const el = document.getElementById(id);
                    if (el) {
                        el.setAttribute('data-lucide', isDark ? 'sun' : 'moon');
                    }
                });
                lucide.createIcons();
            },

            // --- HISTORIAL DE TICKETS ---
            renderTicketHistory(container) {
                const sales = DB.get(DB.KEYS.SALES).slice().reverse();
                this._ticketCache = sales; // cache para acceso seguro por índice

                const rows = sales.length === 0
                    ? `<div class="py-20 text-center text-slate-300 dark:text-slate-600 font-bold italic">
                           <i data-lucide="receipt" class="w-12 h-12 mx-auto mb-4 opacity-20"></i>
                           <p>No hay tickets registrados a&uacute;n</p>
                       </div>`
                    : sales.map((s, idx) => {
                        const date = new Date(s.date);
                        const dateStr = `${date.getDate()}/${date.getMonth() + 1}/${date.getFullYear()} ${date.toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit' })}`;
                        const ticketLabel = s.ticketNum ? `#${s.ticketNum}` : `#${s.id.toString().slice(-4)}`;
                        return `
                        <div class="p-6 flex items-center justify-between hover:bg-slate-50 dark:hover:bg-slate-700/50 transition-colors">
                            <div class="flex items-center gap-4">
                                <div class="w-11 h-11 rounded-2xl bg-emerald-50 dark:bg-emerald-950 flex items-center justify-center text-emerald-600 flex-shrink-0">
                                    <i data-lucide="receipt" class="w-5 h-5"></i>
                                </div>
                                <div>
                                    <p class="font-black text-slate-800 dark:text-slate-100">Ticket ${ticketLabel}</p>
                                    <p class="text-xs font-bold text-slate-400 uppercase tracking-tighter">${dateStr} &bull; ${s.items.length} art&iacute;culo${s.items.length !== 1 ? 's' : ''}</p>
                                </div>
                            </div>
                            <div class="flex items-center gap-4">
                                <span class="text-xl font-black text-emerald-600">$${parseFloat(s.total).toFixed(2)}</span>
                                <div class="flex gap-2">
                                    <button
                                        onclick="app.reopenTicket(${idx})"
                                        class="flex items-center gap-1.5 px-3 py-2 bg-slate-100 dark:bg-slate-700 hover:bg-emerald-500 hover:text-white text-slate-500 dark:text-slate-300 rounded-xl transition-all text-sm font-bold">
                                        <i data-lucide="eye" class="w-4 h-4"></i>
                                        <span>Ver</span>
                                    </button>
                                    <button
                                        onclick="app.downloadTicketPDF((app._ticketCache||[])[${idx}],(app._ticketCache||[])[${idx}]?.given||(app._ticketCache||[])[${idx}]?.total,(app._ticketCache||[])[${idx}]?.items)"
                                        class="flex items-center gap-1.5 px-3 py-2 bg-slate-100 dark:bg-slate-700 hover:bg-blue-500 hover:text-white text-slate-500 dark:text-slate-300 rounded-xl transition-all text-sm font-bold">
                                        <i data-lucide="file-down" class="w-4 h-4"></i>
                                        <span>PDF</span>
                                    </button>
                                    <button
                                        onclick="app.deleteTicket(${idx})"
                                        class="flex items-center justify-center w-10 bg-slate-100 dark:bg-slate-700 hover:bg-rose-500 hover:text-white text-slate-500 dark:text-slate-300 rounded-xl transition-all">
                                        <i data-lucide="trash-2" class="w-4 h-4"></i>
                                    </button>
                                </div>
                            </div>
                        </div>`;
                    }).join('');

                container.innerHTML = `
                    <div class="mb-10 flex flex-col md:flex-row justify-between items-start md:items-center gap-6">
                        <div>
                            <h2 class="text-4xl font-extrabold text-slate-900 dark:text-white tracking-tight">Historial de Tickets</h2>
                            <p class="text-slate-500 dark:text-slate-400 font-medium mt-1">${sales.length} ticket${sales.length !== 1 ? 's' : ''} registrado${sales.length !== 1 ? 's' : ''}</p>
                        </div>
                    </div>
                    <div class="bg-white dark:bg-slate-800 rounded-[3rem] border border-slate-100 dark:border-slate-700 overflow-hidden shadow-sm">
                        <div class="divide-y divide-slate-50 dark:divide-slate-700/60">
                            ${rows}
                        </div>
                    </div>
                `;
            },

            reopenTicket(idx) {
                const saleData = (this._ticketCache || [])[idx];
                if (!saleData) return;
                const given = saleData.given ?? saleData.total;
                app.showTicket(saleData, given, saleData.items);
            },

            deleteTicket(idx) {
                if (!confirm('¿Estás seguro de eliminar este ticket? Esta acción no se puede deshacer.')) return;

                const sales = DB.get(DB.KEYS.SALES);
                // Como el historial está invertido, el índice real es: sales.length - 1 - idx
                const realIdx = sales.length - 1 - idx;

                if (realIdx >= 0 && realIdx < sales.length) {
                    sales.splice(realIdx, 1);
                    DB.save(DB.KEYS.SALES, sales);
                    this.currentView = ''; // Forzar re-render
                    this.showView('tickets');
                }
            },

            // --- VISTA PERFIL ---
            renderProfile(container) {
                const profile = DB.get(DB.KEYS.PROFILE);
                container.innerHTML = `
                    <div class="max-w-xl mx-auto">
                        <div class="mb-10 text-center md:text-left">
                            <h2 class="text-4xl font-extrabold text-slate-900 dark:text-white tracking-tight">Mi Perfil</h2>
                            <p class="text-slate-500 dark:text-slate-400 mt-2">Personaliza la información de tu puesto en el mercado.</p>
                        </div>

                        <div class="bg-white rounded-[3rem] shadow-2xl shadow-slate-200 border border-slate-100 overflow-hidden">
                            <div class="h-32 bg-emerald-500 flex items-center justify-center relative">
                                <div class="w-24 h-24 bg-white rounded-3xl shadow-xl flex items-center justify-center text-emerald-600 border-4 border-white absolute -bottom-10">
                                    <i data-lucide="store" class="w-10 h-10"></i>
                                </div>
                            </div>
                            
                            <form onsubmit="app.saveProfile(event)" class="p-10 pt-16 space-y-6">
                                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                                    <div>
                                        <label class="block text-xs font-black text-slate-400 uppercase tracking-widest mb-2">Propietario</label>
                                        <input type="text" name="name" value="${profile.name}" required class="w-full p-4 bg-slate-50 rounded-2xl border-none outline-none focus:ring-2 focus:ring-emerald-500 transition-all font-bold">
                                    </div>
                                    <div>

            renderGrid(prods) {
                if (prods.length === 0) return '<div class="col-span-full py-20 text-center text-slate-300 font-bold">No se encontraron productos</div>';
                return prods.map(p => `

                    </div>
                `).join('');

            addToCart(id) {
                const p = DB.get(DB.KEYS.PRODUCTS).find(x => x.id === id);
                if (!p || p.stock <= 0) return;
                const inCart = this.cart.find(x => x.id === id);
                if (inCart) {
                    if (inCart.quantity < p.stock) inCart.quantity++;
                } else {
                    this.cart.push({ ...p, quantity: 1 });
                }
                this.showView('pos');
            },

            updateQty(id, d) {
                const item = this.cart.find(x => x.id === id);
                if (!item) return;
                const p = DB.get(DB.KEYS.PRODUCTS).find(x => x.id === id);
                item.quantity += d;
                if (item.quantity > p.stock) item.quantity = p.stock;
                if (item.quantity <= 0) this.cart = this.cart.filter(x => x.id !== id);
                this.showView('pos');
            },

            getCartTotal() { return this.cart.reduce((s, i) => s + (i.price * i.quantity), 0); },

                            <button onclick="app.processSale()" class="w-full bg-emerald-600 text-white py-6 rounded-3xl font-black text-xl shadow-2xl shadow-emerald-200 hover:bg-emerald-700 active:scale-95 transition-all mt-4">

            closeModal() { document.getElementById('modal-overlay').classList.add('hidden'); },

            calcChange() {
                const total = this.getCartTotal();
                const given = parseFloat(document.getElementById('cash-in').value) || 0;
                const change = given - total;
                const display = document.getElementById('change-out');
                display.innerText = `$${Math.max(0, change).toFixed(2)}`;
                display.className = change >= 0 ? "text-3xl font-black text-emerald-400" : "text-3xl font-black text-rose-400";
            },

            processSale() {
                const total = this.getCartTotal();
                const given = parseFloat(document.getElementById('cash-in').value) || total;
                if (given < total) { alert('Monto insuficiente'); return; }

                // 1. Descontar Stock
                let products = DB.get(DB.KEYS.PRODUCTS);
                this.cart.forEach(item => {
                    const idx = products.findIndex(p => p.id === item.id);
                    if (idx !== -1) products[idx].stock -= item.quantity;
                });
                DB.save(DB.KEYS.PRODUCTS, products);

                // 2. Guardar Venta
                const sales = DB.get(DB.KEYS.SALES);
                const ticketNum = String(sales.length + 1).padStart(5, '0');
                const now = new Date();
                const saleData = {
                    id: Date.now(),
                    ticketNum,
                    items: [...this.cart],
                    total: total,
                    given: given,
                    change: given - total,
                    date: now.toISOString()
                };
                sales.push(saleData);
                DB.save(DB.KEYS.SALES, sales);

                const cartSnapshot = [...this.cart];
                this.closeModal();
                this.cart = [];
                this.showView('pos');

                // 3. Mostrar ticket imprimible
                setTimeout(() => app.showTicket(saleData, given, cartSnapshot), 200);
            },

                                <span>Cambio:</span><span>$${change.toFixed(2)}</span>

                            <div>
                                <label class="block text-xs font-black text-slate-400 uppercase tracking-widest mb-2">Precio ($)</label>
                                <input type="number" step="0.5" name="price" value="${p.price}" required class="w-full p-4 bg-slate-50 rounded-2xl border-none outline-none focus:ring-2 focus:ring-emerald-500 font-bold">
                            </div>
                            <div>
                                <label class="block text-xs font-black text-slate-400 uppercase tracking-widest mb-2">Stock</label>
                                <input type="number" name="stock" value="${p.stock}" required class="w-full p-4 bg-slate-50 rounded-2xl border-none outline-none focus:ring-2 focus:ring-emerald-500 font-bold">
                            </div>
                        </div>
                        <div class="flex gap-4 pt-4">
                            <button type="button" onclick="app.closeModal()" class="flex-1 py-4 font-black text-slate-400">Cancelar</button>
                            <button type="submit" class="flex-[2] bg-emerald-600 text-white py-4 rounded-2xl font-black shadow-xl shadow-emerald-100 hover:bg-emerald-700 transition-all">Guardar</button>
                        </div>
                    </form>
                `;
                lucide.createIcons();
            },

            saveProd(e, id) {
                e.preventDefault();
                const f = new FormData(e.target);
                const prods = DB.get(DB.KEYS.PRODUCTS);
                const data = {
                    id: id || Date.now(),
                    name: f.get('name'),
                    price: parseFloat(f.get('price')),
                    stock: parseInt(f.get('stock')),
                    icon: 'package'
                };
                if (id) {
                    const idx = prods.findIndex(x => x.id === id);
                    prods[idx] = data;
                } else {
                    prods.push(data);
                }
                DB.save(DB.KEYS.PRODUCTS, prods);
                this.closeModal();
                this.currentView = ''; // Forzar re-render del inventario
                this.showView('inventory');
            },

            deleteProd(id) {
                if (!confirm('¿Eliminar producto?')) return;
                const filtered = DB.get(DB.KEYS.PRODUCTS).filter(x => x.id !== id);
                DB.save(DB.KEYS.PRODUCTS, filtered);
                this.showView('inventory');
            },

            // --- VISTA REPORTES ---
            renderReports(container) {
                const sales = DB.get(DB.KEYS.SALES) || [];
                const products = DB.get(DB.KEYS.PRODUCTS) || [];
                const now = new Date();
                const todayStr = now.toDateString();

                // 1. Filtrar ventas de HOY
                const todaySales = sales.filter(s => new Date(s.date).toDateString() === todayStr);
                const todayTotal = todaySales.reduce((s, x) => s + x.total, 0);

                // 2. Calcular Top 3 Productos de HOY
                const itemCounts = {};
                todaySales.forEach(s => {
                    s.items.forEach(item => {
                        itemCounts[item.name] = (itemCounts[item.name] || 0) + item.quantity;
                    });
                });
                const topProducts = Object.entries(itemCounts)
                    .sort(([, a], [, b]) => b - a)
                    .slice(0, 3)
                    .map(([name, qty]) => {
                        const p = products.find(x => x.name === name) || { icon: 'package' };
                        return { name, qty, icon: p.icon };
                    });

                // 3. Preparar datos para Gráfica (Últimos 7 días)
                const last7Days = [...Array(7)].map((_, i) => {
                    const d = new Date();
                    d.setDate(d.getDate() - i);
                    return d.toDateString();
                }).reverse();

                const dailyTotals = last7Days.map(dayStr => {
                    return sales
                        .filter(s => new Date(s.date).toDateString() === dayStr)
                        .reduce((sum, s) => sum + s.total, 0);
                });

                const dayLabels = last7Days.map(d => {
                    const date = new Date(d);
                    return date.toLocaleDateString('es-MX', { weekday: 'short', day: 'numeric' });
                });

                container.innerHTML = `
                    <div class="mb-10">
                        <h2 class="text-4xl font-extrabold text-slate-900 dark:text-white tracking-tight">Corte de Caja</h2>
                        <p class="text-slate-500 dark:text-slate-400 mt-2 font-medium">Análisis de rendimiento y ventas del día.</p>
                    </div>

                    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8 mb-10">
                        <!-- KPI Principal -->
                        <div class="lg:col-span-2 bg-emerald-600 p-10 rounded-[3rem] text-white shadow-2xl shadow-emerald-200 flex flex-col justify-between relative overflow-hidden">
                            <div class="relative z-10">
                                <span class="text-xs font-black uppercase opacity-60 tracking-[0.2em]">Ventas de Hoy</span>
                                <div class="text-6xl font-black mt-2 leading-none">$${todayTotal.toFixed(2)}</div>
                                <div class="mt-8 flex gap-6">
                                    <div>
                                        <p class="text-[10px] font-black uppercase opacity-60">Tickets</p>
                                        <p class="text-2xl font-black">${todaySales.length}</p>
                                    </div>
                                    <div class="w-px h-10 bg-white/20"></div>
                                    <div>
                                        <p class="text-[10px] font-black uppercase opacity-60">Promedio</p>
                                        <p class="text-2xl font-black">$${todaySales.length ? (todayTotal / todaySales.length).toFixed(1) : '0'}</p>
                                    </div>
                                </div>
                            </div>
                            <i data-lucide="trending-up" class="absolute -bottom-10 -right-10 w-64 h-64 text-white/10 rotate-12"></i>
                        </div>

                        <!-- Top Productos -->
                        <div class="bg-white dark:bg-slate-800 p-8 rounded-[3rem] border border-slate-100 dark:border-slate-700 shadow-sm">
                            <h3 class="font-black text-slate-800 dark:text-slate-200 text-xs uppercase tracking-widest mb-6">Más Vendidos Hoy</h3>
                            <div class="space-y-4">
                                ${topProducts.length === 0 ? '<p class="text-center py-10 text-slate-300 italic font-bold">Sin ventas hoy</p>' :
                        topProducts.map((p, i) => `
                                    <div class="flex items-center gap-4 p-3 rounded-2xl bg-slate-50 dark:bg-slate-700/50 border border-slate-100 dark:border-slate-600">
                                        <div class="w-10 h-10 rounded-xl bg-white dark:bg-slate-800 flex items-center justify-center text-emerald-600 shadow-sm">
                                            <i data-lucide="${p.icon}" class="w-5 h-5"></i>
                                        </div>
                                        <div class="flex-1 min-w-0">
                                            <p class="font-black text-slate-800 dark:text-slate-100 text-sm truncate">${p.name}</p>
                                            <p class="text-[10px] font-bold text-slate-400 uppercase">${p.qty} unidades</p>
                                        </div>
                                        <div class="text-emerald-500 font-black text-xs">#${i + 1}</div>
                                    </div>
                                `).join('')
                    }
                            </div>
                        </div>
                    </div>

                    <!-- Gráfica Semanal -->
                    <div class="bg-white dark:bg-slate-800 p-10 rounded-[3rem] border border-slate-100 dark:border-slate-700 shadow-sm mb-10">
                        <div class="flex justify-between items-center mb-8">
                            <h3 class="font-black text-slate-800 dark:text-slate-200 text-xs uppercase tracking-widest">Rendimiento Semanal</h3>
                            <div class="flex items-center gap-2 text-emerald-600 font-black text-xs">
                                <i data-lucide="calendar" class="w-4 h-4"></i> Últimos 7 días
                            </div>
                        </div>
                        <div class="h-64 w-full">
                            <canvas id="salesChart"></canvas>
                        </div>
                    </div>

                    <div class="bg-white dark:bg-slate-800 rounded-[3rem] border border-slate-100 dark:border-slate-700 overflow-hidden shadow-sm">
                        <div class="p-8 border-b dark:border-slate-700 bg-slate-50/50 dark:bg-slate-700/30">
                            <h3 class="font-black text-slate-800 dark:text-slate-200 text-xs uppercase tracking-widest">Historial Reciente</h3>
                        </div>
                        <div class="divide-y divide-slate-50 dark:divide-slate-700/60">
                            ${sales.length === 0 ? '<p class="p-10 text-center text-slate-300 font-bold italic">No hay ventas registradas</p>' :
                        sales.slice(-10).reverse().map(s => `
                                    <div class="p-8 flex justify-between items-center hover:bg-slate-50/30 dark:hover:bg-slate-700/30 transition-all">
                                        <div>
                                            <p class="font-black text-slate-800 dark:text-slate-100">Venta #${s.id.toString().slice(-4)}</p>
                                            <p class="text-xs font-bold text-slate-400 uppercase tracking-tighter">${new Date(s.date).toLocaleTimeString()}</p>
                                        </div>
                                        <div class="text-right">
                                            <p class="text-2xl font-black text-emerald-600">$${s.total.toFixed(2)}</p>
                                            <p class="text-[10px] text-slate-300 font-black uppercase tracking-widest">${s.items.length} Artículos</p>
                                        </div>
                                    </div>
                                `).join('')
                    }
                        </div>
                    </div>
                `;

                // Inicializar Gráfica
                setTimeout(() => {
                    const ctx = document.getElementById('salesChart');
                    if (!ctx) return;
                    new Chart(ctx, {
                        type: 'bar',
                        data: {
                            labels: dayLabels,
                            datasets: [{
                                label: 'Ventas ($)',
                                data: dailyTotals,
                                backgroundColor: '#10b981',
                                borderRadius: 12,
                                borderSkipped: false,
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: {
                                legend: { display: false },
                                tooltip: {
                                    backgroundColor: '#0f172a',
                                    padding: 12,
                                    titleFont: { size: 12, weight: 'bold' },
                                    bodyFont: { size: 14, weight: '900' },
                                    displayColors: false
                                }
                            },
                            scales: {
                                x: { grid: { display: false }, ticks: { font: { weight: 'bold' }, color: '#94a3b8' } },
                                y: { grid: { color: '#f1f5f9' }, min: 0, ticks: { font: { weight: 'bold' }, color: '#94a3b8' } }
                            }
                        }
                    });
                    lucide.createIcons();
                }, 50);
            },

            filterPOS(q) {
                const grid = document.getElementById('pos-grid');
                const products = DB.get(DB.KEYS.PRODUCTS);
                const filtered = products.filter(p => p.name.toLowerCase().includes(q.toLowerCase()));
                grid.innerHTML = this.renderGrid(filtered);
                lucide.createIcons();
            },

            // --- DESCARGAR TICKET PDF (estilo Chedraui) ---
            downloadTicketPDF(saleData, given, items) {
                if (!saleData || !items) return;
                const { jsPDF } = window.jspdf;
                const profile = DB.get(DB.KEYS.PROFILE);
                const doc = new jsPDF({ unit: 'mm', format: [80, 297], orientation: 'portrait' });
                const pageW = 80;
                const margin = 5;
                let y = 7;
                const lineH = 4.2;

                // ======== ENCABEZADO ========
                doc.setFont('courier', 'bold');
                doc.setFontSize(12);
                doc.text(profile.business.toUpperCase(), pageW / 2, y, { align: 'center' }); y += lineH + 1;

                doc.setFont('courier', 'normal');
                doc.setFontSize(7.5);
                const locLines = doc.splitTextToSize(profile.location, pageW - margin * 2);
                locLines.forEach(l => { doc.text(l, pageW / 2, y, { align: 'center' }); y += lineH; });
                doc.text('Tel: ' + profile.phone, pageW / 2, y, { align: 'center' }); y += lineH + 1;

                // ======== DIVIDER ========
                doc.setDrawColor(170); doc.setLineDash([1.5, 1.5]);
                doc.line(margin, y, pageW - margin, y); y += 3;

                // ======== FECHA Y TICKET ========
                const date = new Date(saleData.date);
                const dateStr = date.toLocaleDateString('es-MX') + ' ' + date.toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit' });
                doc.setFontSize(7.5); doc.setFont('courier', 'normal');
                doc.text('Fecha:', margin, y); doc.text(dateStr, pageW - margin, y, { align: 'right' }); y += lineH;
                doc.text('Ticket #:', margin, y); doc.text(saleData.ticketNum || String(saleData.id).slice(-5), pageW - margin, y, { align: 'right' }); y += lineH + 1;

                // ======== DIVIDER ========
                doc.setLineDash([1.5, 1.5]);
                doc.line(margin, y, pageW - margin, y); y += 3;

                // ======== TABLA DE ARTÍCULOS ========
                const tableBody = items.map(i => [
                    String(i.quantity),
                    i.name,
                    '$' + parseFloat(i.price).toFixed(2),
                    '$' + (i.price * i.quantity).toFixed(2)
                ]);

                doc.autoTable({
                    startY: y,
                    head: [['CANT', 'ARTÍCULO', 'PRECIO', 'TOTAL']],
                    body: tableBody,
                    theme: 'plain',
                    styles: { fontSize: 7, cellPadding: [1, 1], font: 'courier', overflow: 'linebreak', textColor: [0, 0, 0] },
                    headStyles: { fontStyle: 'bold', fontSize: 7, lineWidth: { bottom: 0.3 }, lineColor: [0, 0, 0], fillColor: false },
                    columnStyles: {
                        0: { cellWidth: 8, halign: 'center' },
                        1: { cellWidth: 34 },
                        2: { cellWidth: 15, halign: 'right' },
                        3: { cellWidth: 13, halign: 'right' }
                    },
                    margin: { left: margin, right: margin },
                    tableWidth: pageW - margin * 2
                });
                y = doc.lastAutoTable.finalY + 2;

                // ======== DIVIDER ========
                doc.setLineDash([1.5, 1.5]);
                doc.line(margin, y, pageW - margin, y); y += 3;

                // ======== TOTALES ========
                const change = given - saleData.total;
                doc.setFont('courier', 'bold'); doc.setFontSize(9);
                doc.text('* *', margin, y);
                doc.text('TOTAL M.N. $', pageW / 2, y, { align: 'right' });
                doc.text(saleData.total.toFixed(2), pageW - margin, y, { align: 'right' }); y += lineH;

                doc.setFont('courier', 'normal'); doc.setFontSize(7.5);
                doc.text('Efectivo$', pageW / 2, y, { align: 'right' });
                doc.text(parseFloat(given).toFixed(2), pageW - margin, y, { align: 'right' }); y += lineH;

                doc.setFont('courier', 'bold'); doc.setFontSize(9);
                doc.text('CAMBIO$', pageW / 2, y, { align: 'right' });
                doc.text(Math.max(0, change).toFixed(2), pageW - margin, y, { align: 'right' }); y += lineH + 1;

                // ======== TOTAL ARTÍCULOS ========
                doc.setFont('courier', 'normal'); doc.setFontSize(7.5);
                const totalUnits = items.reduce((s, i) => s + i.quantity, 0);
                doc.text('TOTAL DE ARTICULOS VENDIDOS = ' + totalUnits, pageW / 2, y, { align: 'center' }); y += lineH + 2;

                // ======== DIVIDER ========
                doc.setLineDash([1.5, 1.5]);
                doc.line(margin, y, pageW - margin, y); y += 3;

                // ======== PIE ========
                doc.setFont('courier', 'bold'); doc.setFontSize(8);
                doc.text('¡GRACIAS POR SU COMPRA!', pageW / 2, y, { align: 'center' }); y += lineH;
                doc.setFont('courier', 'normal'); doc.setFontSize(7);
                doc.text('Si requiere factura solícitela en el momento.', pageW / 2, y, { align: 'center', maxWidth: pageW - margin * 2 }); y += lineH;
                doc.text(profile.business, pageW / 2, y, { align: 'center' });

                doc.save('ticket-' + (saleData.ticketNum || saleData.id) + '.pdf');
            },

            reset() { if (confirm('¿Cerrar caja y salir?')) location.reload(); }
        };

        window.onload = () => app.init();
    </script>
</body>

</html>
