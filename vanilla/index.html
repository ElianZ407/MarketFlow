<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MarketFlow - Mercado Pino Suárez</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        .custom-scroll::-webkit-scrollbar {
            width: 4px;
        }

        .custom-scroll::-webkit-scrollbar-track {
            background: #f1f1f1;
        }

        .custom-scroll::-webkit-scrollbar-thumb {
            background: #10b981;
            border-radius: 10px;
        }

        .view-animate {
            animation: slideUp 0.3s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Estilo para simular las imágenes flat de nano banana */
        .product-art {
            background: linear-gradient(135deg, #ecfdf5 0%, #d1fae5 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .product-art::after {
            content: '';
            position: absolute;
            width: 150%;
            height: 150%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.4) 0%, rgba(255, 255, 255, 0) 70%);
            top: -50%;
            left: -50%;
        }

        @media print {
            .no-print {
                display: none !important;
            }

            #ticket-area {
                display: block !important;
            }
        }
    </style>
</head>

<body class="bg-slate-50 text-slate-900 min-h-screen pb-20 md:pb-0">

    <!-- SIDEBAR (Escritorio) -->
    <aside class="hidden md:flex flex-col w-64 bg-emerald-950 text-white fixed h-full left-0 top-0 z-50">
        <div class="p-8">
            <div class="flex items-center gap-3 mb-10">
                <div class="bg-emerald-500 p-2 rounded-2xl shadow-lg shadow-emerald-500/20">
                    <i data-lucide="shopping-bag" class="w-6 h-6 text-white"></i>
                </div>
                <h1 class="text-xl font-extrabold tracking-tight">MarketFlow</h1>
            </div>

            <nav class="space-y-2">
                <button onclick="app.showView('pos')" id="nav-pos"
                    class="nav-btn w-full flex items-center gap-3 p-3.5 rounded-2xl transition-all hover:bg-emerald-800 text-emerald-100/70">
                    <i data-lucide="layout-grid" class="w-5 h-5"></i>
                    <span class="font-bold text-sm">Ventas</span>
                </button>
                <button onclick="app.showView('inventory')" id="nav-inventory"
                    class="nav-btn w-full flex items-center gap-3 p-3.5 rounded-2xl transition-all hover:bg-emerald-800 text-emerald-100/70">
                    <i data-lucide="package" class="w-5 h-5"></i>
                    <span class="font-bold text-sm">Inventario</span>
                </button>
                <button onclick="app.showView('reports')" id="nav-reports"
                    class="nav-btn w-full flex items-center gap-3 p-3.5 rounded-2xl transition-all hover:bg-emerald-800 text-emerald-100/70">
                    <i data-lucide="bar-chart-3" class="w-5 h-5"></i>
                    <span class="font-bold text-sm">Corte Diario</span>
                </button>
                <button onclick="app.showView('profile')" id="nav-profile"
                    class="nav-btn w-full flex items-center gap-3 p-3.5 rounded-2xl transition-all hover:bg-emerald-800 text-emerald-100/70">
                    <i data-lucide="user" class="w-5 h-5"></i>
                    <span class="font-bold text-sm">Mi Perfil</span>
                </button>
            </nav>
        </div>

        <div class="mt-auto p-6 border-t border-emerald-900 bg-emerald-950/50">
            <div class="flex items-center gap-3 mb-4">
                <div id="sidebar-avatar"
                    class="w-10 h-10 rounded-2xl bg-emerald-500 flex items-center justify-center font-black text-white shadow-lg shadow-emerald-500/20 uppercase">
                    EZ</div>
                <div class="flex-1 min-w-0">
                    <p id="sidebar-biz-name" class="text-sm font-bold truncate">Cargando...</p>
                    <p class="text-[10px] text-emerald-400 font-bold uppercase tracking-widest">Locatario</p>
                </div>
            </div>
            <button onclick="app.reset()"
                class="flex items-center gap-2 text-xs font-bold text-emerald-300 hover:text-white transition w-full">
                <i data-lucide="log-out" class="w-4 h-4"></i> Cerrar Sesión
            </button>
        </div>
    </aside>

    <!-- HEADER (Móvil) -->
    <header
        class="md:hidden bg-emerald-950 text-white p-4 flex justify-between items-center sticky top-0 z-40 shadow-xl no-print">
        <div class="flex items-center gap-2">
            <div class="bg-emerald-500 p-1.5 rounded-xl">
                <i data-lucide="shopping-bag" class="w-5 h-5 text-white"></i>
            </div>
            <span class="font-black text-lg tracking-tight">MarketFlow</span>
        </div>
        <button onclick="app.showView('profile')"
            class="bg-emerald-800 w-10 h-10 rounded-2xl flex items-center justify-center border border-emerald-700 shadow-lg shadow-black/20">
            <i data-lucide="user" class="w-5 h-5"></i>
        </button>
    </header>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="md:ml-64 p-4 md:p-8 no-print pb-24 md:pb-8" id="view-container">
        <!-- Vistas dinámicas -->
    </main>

    <!-- NAVEGACIÓN INFERIOR (Móvil) -->
    <nav
        class="md:hidden fixed bottom-0 left-0 right-0 bg-white border-t border-slate-100 flex justify-around p-3 z-50 shadow-[0_-5px_20px_rgba(0,0,0,0.05)] no-print">
        <button onclick="app.showView('pos')" class="flex flex-col items-center gap-1 text-emerald-600">
            <i data-lucide="layout-grid" class="w-6 h-6"></i>
            <span class="text-[10px] font-bold uppercase tracking-tighter">Ventas</span>
        </button>
        <button onclick="app.showView('inventory')" class="flex flex-col items-center gap-1 text-slate-400">
            <i data-lucide="package" class="w-6 h-6"></i>
            <span class="text-[10px] font-bold uppercase tracking-tighter">Stock</span>
        </button>
        <button onclick="app.showView('reports')" class="flex flex-col items-center gap-1 text-slate-400">
            <i data-lucide="bar-chart-3" class="w-6 h-6"></i>
            <span class="text-[10px] font-bold uppercase tracking-tighter">Corte</span>
        </button>
        <button onclick="app.showView('profile')" class="flex flex-col items-center gap-1 text-slate-400">
            <i data-lucide="user" class="w-6 h-6"></i>
            <span class="text-[10px] font-bold uppercase tracking-tighter">Perfil</span>
        </button>
    </nav>

    <!-- MODAL -->
    <div id="modal-overlay"
        class="fixed inset-0 bg-slate-900/60 backdrop-blur-md z-[60] hidden flex items-center justify-center p-4">
        <div id="modal-content"
            class="bg-white rounded-[2.5rem] w-full max-w-md shadow-2xl overflow-hidden animate-in fade-in zoom-in duration-300">
            <!-- Contenido dinámico -->
        </div>
    </div>

    <script>
        /**
         * DB Y PERSISTENCIA
         */
        const DB = {
            KEYS: { PRODUCTS: 'mf_products', SALES: 'mf_sales', PROFILE: 'mf_profile' },
            init() {
                if (!localStorage.getItem(this.KEYS.PRODUCTS)) {
                    const iniciales = [
                        { id: 1, name: 'Queso Sopero Tabasco', price: 145, stock: 20, category: 'Lácteos', icon: 'cheese' },
                        { id: 2, name: 'Horchata de Arroz 1L', price: 35, stock: 50, category: 'Bebidas', icon: 'droplet' },
                        { id: 3, name: 'Butifarras Jalpa (Orden)', price: 95, stock: 15, category: 'Comida', icon: 'utensils' },
                        { id: 4, name: 'Chile Amashito (bolsa)', price: 15, stock: 40, category: 'Verduras', icon: 'flame' },
                        { id: 5, name: 'Plátano Macho (kg)', price: 22, stock: 100, category: 'Frutas', icon: 'banana' },
                        { id: 6, name: 'Carne de Res Premium', price: 180, stock: 30, category: 'Carnicería', icon: 'beef' }
                    ];
                    localStorage.setItem(this.KEYS.PRODUCTS, JSON.stringify(iniciales));
                }
                if (!localStorage.getItem(this.KEYS.SALES)) localStorage.setItem(this.KEYS.SALES, '[]');
                if (!localStorage.getItem(this.KEYS.PROFILE)) {
                    localStorage.setItem(this.KEYS.PROFILE, JSON.stringify({
                        name: 'Elian Zurita',
                        business: 'Novedades Elian',
                        phone: '9931234567',
                        location: 'Mercado Pino Suárez, Villahermosa'
                    }));
                }
            },
            get(key) { return JSON.parse(localStorage.getItem(key)); },
            save(key, data) { localStorage.setItem(key, JSON.stringify(data)); }
        };

        /**
         * APP CORE
         */
        const app = {
            cart: [],
            currentView: '',

            init() {
                DB.init();
                this.syncProfile();
                this.showView('pos');
                lucide.createIcons();
            },

            syncProfile() {
                const p = DB.get(DB.KEYS.PROFILE);
                document.getElementById('sidebar-biz-name').innerText = p.business;
                document.getElementById('sidebar-avatar').innerText = p.name.substring(0, 2).toUpperCase();
            },

            showView(view) {
                if (this.currentView === view && view !== 'pos') return;
                this.currentView = view;
                const container = document.getElementById('view-container');
                container.innerHTML = '';

                const wrapper = document.createElement('div');
                wrapper.className = 'view-animate';

                // Actualizar Botones Nav
                document.querySelectorAll('.nav-btn').forEach(btn => {
                    btn.classList.remove('bg-emerald-800', 'text-white');
                    btn.classList.add('text-emerald-100/70');
                });
                const activeBtn = document.getElementById(`nav-${view}`);
                if (activeBtn) {
                    activeBtn.classList.add('bg-emerald-800', 'text-white');
                    activeBtn.classList.remove('text-emerald-100/70');
                }

                switch (view) {
                    case 'pos': this.renderPOS(wrapper); break;
                    case 'inventory': this.renderInventory(wrapper); break;
                    case 'reports': this.renderReports(wrapper); break;
                    case 'profile': this.renderProfile(wrapper); break;
                }
                container.appendChild(wrapper);
                lucide.createIcons();
            },

            // --- VISTA PERFIL ---
            renderProfile(container) {
                const profile = DB.get(DB.KEYS.PROFILE);
                container.innerHTML = `
                    <div class="max-w-xl mx-auto">
                        <div class="mb-10 text-center md:text-left">
                            <h2 class="text-4xl font-extrabold text-slate-900 tracking-tight">Mi Perfil</h2>
                            <p class="text-slate-500 mt-2">Personaliza la información de tu puesto en el mercado.</p>
                        </div>

                        <div class="bg-white rounded-[3rem] shadow-2xl shadow-slate-200 border border-slate-100 overflow-hidden">
                            <div class="h-32 bg-emerald-500 flex items-center justify-center relative">
                                <div class="w-24 h-24 bg-white rounded-3xl shadow-xl flex items-center justify-center text-emerald-600 border-4 border-white absolute -bottom-10">
                                    <i data-lucide="store" class="w-10 h-10"></i>
                                </div>
                            </div>
                            
                            <form onsubmit="app.saveProfile(event)" class="p-10 pt-16 space-y-6">
                                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                                    <div>
                                        <label class="block text-xs font-black text-slate-400 uppercase tracking-widest mb-2">Propietario</label>
                                        <input type="text" name="name" value="${profile.name}" required class="w-full p-4 bg-slate-50 rounded-2xl border-none outline-none focus:ring-2 focus:ring-emerald-500 transition-all font-bold">
                                    </div>
                                    <div>
                                        <label class="block text-xs font-black text-slate-400 uppercase tracking-widest mb-2">Nombre Negocio</label>
                                        <input type="text" name="business" value="${profile.business}" required class="w-full p-4 bg-slate-50 rounded-2xl border-none outline-none focus:ring-2 focus:ring-emerald-500 transition-all font-bold">
                                    </div>
                                </div>
                                <div>
                                    <label class="block text-xs font-black text-slate-400 uppercase tracking-widest mb-2">WhatsApp (10 dígitos)</label>
                                    <input type="tel" name="phone" value="${profile.phone}" required class="w-full p-4 bg-slate-50 rounded-2xl border-none outline-none focus:ring-2 focus:ring-emerald-500 transition-all font-bold" placeholder="993...">
                                </div>
                                <div>
                                    <label class="block text-xs font-black text-slate-400 uppercase tracking-widest mb-2">Ubicación</label>
                                    <input type="text" name="location" value="${profile.location}" required class="w-full p-4 bg-slate-50 rounded-2xl border-none outline-none focus:ring-2 focus:ring-emerald-500 transition-all font-bold">
                                </div>
                                <button type="submit" class="w-full bg-emerald-600 text-white py-5 rounded-2xl font-black text-lg shadow-xl shadow-emerald-200 hover:bg-emerald-700 active:scale-95 transition-all">
                                    Guardar Configuración
                                </button>
                            </form>
                        </div>
                    </div>
                `;
            },

            saveProfile(e) {
                e.preventDefault();
                const f = new FormData(e.target);
                const newData = {
                    name: f.get('name'),
                    business: f.get('business'),
                    phone: f.get('phone'),
                    location: f.get('location')
                };
                DB.save(DB.KEYS.PROFILE, newData);
                this.syncProfile();
                this.showView('pos');
            },

            // --- VISTA POS ---
            renderPOS(container) {
                const products = DB.get(DB.KEYS.PRODUCTS);
                container.innerHTML = `
                    <div class="flex flex-col lg:flex-row gap-8">
                        <!-- Productos -->
                        <div class="flex-1 min-w-0">
                            <div class="mb-8 flex flex-col md:flex-row justify-between items-start md:items-center gap-6">
                                <div>
                                    <h2 class="text-3xl font-black text-slate-900 tracking-tight">Caja Registradora</h2>
                                    <p class="text-slate-500 font-medium">Mercado José M. Pino Suárez</p>
                                </div>
                                <div class="relative w-full md:w-80">
                                    <i data-lucide="search" class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 w-5 h-5"></i>
                                    <input type="text" oninput="app.filterPOS(this.value)" placeholder="Buscar producto..." class="w-full pl-12 pr-4 py-4 rounded-3xl bg-white border-none shadow-xl shadow-slate-200/50 focus:ring-2 focus:ring-emerald-500 outline-none text-slate-700 font-bold">
                                </div>
                            </div>

                            <div id="pos-grid" class="grid grid-cols-2 sm:grid-cols-3 xl:grid-cols-4 gap-5">
                                ${this.renderGrid(products)}
                            </div>
                        </div>

                        <!-- Carrito Sidebar -->
                        <div class="w-full lg:w-96 flex flex-col h-[calc(100vh-140px)] sticky top-8">
                            <div class="bg-white rounded-[3rem] shadow-2xl shadow-slate-200/50 border border-slate-100 flex flex-col flex-1 overflow-hidden">
                                <div class="p-8 border-b flex justify-between items-center bg-slate-50/50">
                                    <h3 class="font-black flex items-center gap-2 text-slate-800 uppercase text-xs tracking-[0.2em]">
                                        <i data-lucide="shopping-cart" class="w-4 h-4 text-emerald-600"></i> Carrito Actual
                                    </h3>
                                    <button onclick="app.cart = []; app.showView('pos')" class="text-rose-500 hover:scale-110 transition-transform"><i data-lucide="trash-2" class="w-5 h-5"></i></button>
                                </div>
                                <div id="cart-list" class="flex-1 overflow-y-auto p-6 space-y-4 custom-scroll">
                                    ${this.renderCart()}
                                </div>
                                <div class="p-8 border-t bg-slate-50/50">
                                    <div class="flex justify-between items-end mb-8">
                                        <span class="text-slate-400 font-black uppercase text-[10px] tracking-widest">Total a pagar</span>
                                        <span class="text-4xl font-black text-emerald-700 leading-none">$${this.getCartTotal().toFixed(2)}</span>
                                    </div>
                                    <button onclick="app.openCheckout()" class="w-full bg-emerald-600 text-white py-5 rounded-2xl font-black text-xl shadow-2xl shadow-emerald-200 hover:bg-emerald-700 active:scale-95 transition-all flex items-center justify-center gap-3">
                                        <i data-lucide="zap" class="w-6 h-6 fill-white"></i> Cobrar Ahora
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            },

            renderGrid(prods) {
                if (prods.length === 0) return '<div class="col-span-full py-20 text-center text-slate-300 font-bold">No se encontraron productos</div>';
                return prods.map(p => `
                    <button onclick="app.addToCart(${p.id})" class="bg-white p-5 rounded-[2.5rem] shadow-sm border border-transparent hover:border-emerald-500 transition-all text-left group relative">
                        <div class="product-art w-full aspect-square rounded-3xl mb-4 text-emerald-600">
                             <i data-lucide="${p.icon || 'package'}" class="w-10 h-10 group-hover:scale-110 transition-transform"></i>
                        </div>
                        <h4 class="font-extrabold text-slate-800 text-sm leading-tight mb-1 truncate">${p.name}</h4>
                        <div class="flex justify-between items-center">
                            <span class="text-2xl font-black text-emerald-600 leading-none">$${parseFloat(p.price).toFixed(2)}</span>
                            <span class="text-[10px] font-black uppercase ${p.stock < 5 ? 'text-rose-500' : 'text-slate-300'}">${p.stock} pz</span>
                        </div>
                        <div class="absolute inset-0 bg-emerald-500/5 opacity-0 group-active:opacity-100 transition-opacity"></div>
                    </button>
                `).join('');
            },

            renderCart() {
                if (this.cart.length === 0) return '<div class="h-full flex flex-col items-center justify-center text-slate-300 py-20"><i data-lucide="shopping-basket" class="w-12 h-12 mb-4 opacity-10"></i><p class="font-bold">Agrega algo al carrito</p></div>';
                return this.cart.map(item => `
                    <div class="flex items-center gap-4 bg-white p-4 rounded-2xl border border-slate-100 shadow-sm">
                        <div class="flex-1 min-w-0">
                            <h5 class="font-black text-sm text-slate-800 truncate">${item.name}</h5>
                            <p class="text-xs text-emerald-600 font-black">$${item.price} x ${item.quantity}</p>
                        </div>
                        <div class="flex items-center gap-1 bg-slate-100 rounded-xl p-1">
                            <button onclick="app.updateQty(${item.id}, -1)" class="w-8 h-8 flex items-center justify-center hover:bg-white rounded-lg transition-all"><i data-lucide="minus" class="w-3 h-3 text-slate-400"></i></button>
                            <span class="w-6 text-center font-black text-xs text-slate-700">${item.quantity}</span>
                            <button onclick="app.updateQty(${item.id}, 1)" class="w-8 h-8 flex items-center justify-center hover:bg-white rounded-lg transition-all"><i data-lucide="plus" class="w-3 h-3 text-slate-400"></i></button>
                        </div>
                    </div>
                `).join('');
            },

            addToCart(id) {
                const p = DB.get(DB.KEYS.PRODUCTS).find(x => x.id === id);
                if (!p || p.stock <= 0) return;
                const inCart = this.cart.find(x => x.id === id);
                if (inCart) {
                    if (inCart.quantity < p.stock) inCart.quantity++;
                } else {
                    this.cart.push({ ...p, quantity: 1 });
                }
                this.showView('pos');
            },

            updateQty(id, d) {
                const item = this.cart.find(x => x.id === id);
                if (!item) return;
                const p = DB.get(DB.KEYS.PRODUCTS).find(x => x.id === id);
                item.quantity += d;
                if (item.quantity > p.stock) item.quantity = p.stock;
                if (item.quantity <= 0) this.cart = this.cart.filter(x => x.id !== id);
                this.showView('pos');
            },

            getCartTotal() { return this.cart.reduce((s, i) => s + (i.price * i.quantity), 0); },

            // --- CHECKOUT ---
            openCheckout() {
                if (this.cart.length === 0) return;
                const total = this.getCartTotal();
                const modal = document.getElementById('modal-overlay');
                modal.classList.remove('hidden');
                document.getElementById('modal-content').innerHTML = `
                    <div class="p-10">
                        <div class="flex justify-between items-center mb-8">
                            <h2 class="text-2xl font-black text-slate-800">Finalizar Venta</h2>
                            <button onclick="app.closeModal()" class="text-slate-400 hover:text-slate-900 transition-colors"><i data-lucide="x" class="w-6 h-6"></i></button>
                        </div>

                        <div class="bg-emerald-50 p-8 rounded-[2.5rem] mb-8 flex justify-between items-center border border-emerald-100 shadow-inner">
                            <span class="text-emerald-800 font-black text-xs uppercase tracking-widest opacity-50">Total</span>
                            <span class="text-4xl font-black text-emerald-700 leading-none">$${total.toFixed(2)}</span>
                        </div>

                        <div class="space-y-6">
                            <div>
                                <label class="block text-xs font-black text-slate-400 uppercase mb-3 tracking-widest">Dinero Recibido</label>
                                <div class="relative">
                                    <span class="absolute left-6 top-1/2 -translate-y-1/2 text-3xl font-black text-slate-300">$</span>
                                    <input type="number" id="cash-in" oninput="app.calcChange()" autofocus
                                        class="w-full pl-14 pr-4 py-6 bg-slate-100 rounded-3xl outline-none text-4xl font-black focus:ring-4 focus:ring-emerald-100 transition-all border-none" placeholder="0.00">
                                </div>
                            </div>

                            <div class="flex justify-between items-center px-8 py-6 bg-slate-900 rounded-[2rem] text-white shadow-xl shadow-slate-900/20">
                                <span class="text-xs font-black uppercase tracking-widest opacity-40">Cambio</span>
                                <span id="change-out" class="text-3xl font-black text-emerald-400 tracking-tight">$0.00</span>
                            </div>

                            <button onclick="app.processSale()" class="w-full bg-emerald-600 text-white py-6 rounded-3xl font-black text-xl shadow-2xl shadow-emerald-200 hover:bg-emerald-700 active:scale-95 transition-all mt-4">
                                COBRAR Y ENVIAR TICKET
                            </button>
                        </div>
                    </div>
                `;
                lucide.createIcons();
            },

            closeModal() { document.getElementById('modal-overlay').classList.add('hidden'); },

            calcChange() {
                const total = this.getCartTotal();
                const given = parseFloat(document.getElementById('cash-in').value) || 0;
                const change = given - total;
                const display = document.getElementById('change-out');
                display.innerText = `$${Math.max(0, change).toFixed(2)}`;
                display.className = change >= 0 ? "text-3xl font-black text-emerald-400" : "text-3xl font-black text-rose-400";
            },

            processSale() {
                const total = this.getCartTotal();
                const given = parseFloat(document.getElementById('cash-in').value) || total;
                if (given < total) { alert('Monto insuficiente'); return; }

                // 1. Descontar Stock
                let products = DB.get(DB.KEYS.PRODUCTS);
                this.cart.forEach(item => {
                    const idx = products.findIndex(p => p.id === item.id);
                    if (idx !== -1) products[idx].stock -= item.quantity;
                });
                DB.save(DB.KEYS.PRODUCTS, products);

                // 2. Guardar Venta
                const sales = DB.get(DB.KEYS.SALES);
                const saleData = {
                    id: Date.now(),
                    items: [...this.cart],
                    total: total,
                    date: new Date().toISOString()
                };
                sales.push(saleData);
                DB.save(DB.KEYS.SALES, sales);

                // 3. WhatsApp Ticket
                const profile = DB.get(DB.KEYS.PROFILE);
                const detail = this.cart.map(i => `${i.quantity}x ${i.name}`).join('%0A');
                const waMsg = `¡Gracias por tu compra en ${profile.business}!%0A---%0A${detail}%0A%0A*TOTAL: $${total.toFixed(2)}*%0A---%0AFolio: #${saleData.id.toString().slice(-4)}%0A¡Te esperamos en el Pino Suárez!`;

                this.closeModal();
                this.cart = [];
                this.showView('pos');

                setTimeout(() => {
                    const confirmWA = window.confirm("¿Enviar ticket por WhatsApp al cliente?");
                    if (confirmWA) window.open(`https://wa.me/?text=${waMsg}`, '_blank');
                }, 300);
            },

            // --- VISTA INVENTARIO ---
            renderInventory(container) {
                const products = DB.get(DB.KEYS.PRODUCTS);
                container.innerHTML = `
                    <div class="mb-10 flex flex-col md:flex-row justify-between items-start md:items-center gap-6">
                        <div>
                            <h2 class="text-4xl font-extrabold text-slate-900 tracking-tight">Inventario</h2>
                            <p class="text-slate-500 font-medium">Gestiona tus productos del mercado.</p>
                        </div>
                        <button onclick="app.openProductModal()" class="bg-emerald-600 text-white px-8 py-4 rounded-[1.5rem] font-black flex items-center gap-2 shadow-xl shadow-emerald-100 hover:bg-emerald-700 transition-all">
                            <i data-lucide="plus" class="w-5 h-5"></i> Nuevo Producto
                        </button>
                    </div>

                    <div class="bg-white rounded-[3rem] shadow-sm border border-slate-100 overflow-hidden">
                        <table class="w-full text-left">
                            <thead class="bg-slate-50/50 border-b border-slate-100">
                                <tr>
                                    <th class="p-8 text-xs font-black text-slate-400 uppercase tracking-widest">Artículo</th>
                                    <th class="p-8 text-xs font-black text-slate-400 uppercase tracking-widest text-right">Precio</th>
                                    <th class="p-8 text-xs font-black text-slate-400 uppercase tracking-widest text-center">Stock</th>
                                    <th class="p-8 text-xs font-black text-slate-400 uppercase tracking-widest text-right">Acciones</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-slate-50">
                                ${products.map(p => `
                                    <tr class="hover:bg-slate-50/20 transition-colors">
                                        <td class="p-8">
                                            <div class="flex items-center gap-4">
                                                <div class="w-10 h-10 bg-emerald-50 rounded-xl flex items-center justify-center text-emerald-600">
                                                    <i data-lucide="${p.icon || 'package'}" class="w-5 h-5"></i>
                                                </div>
                                                <span class="font-bold text-slate-700">${p.name}</span>
                                            </div>
                                        </td>
                                        <td class="p-8 font-black text-emerald-600 text-right text-lg">$${p.price.toFixed(2)}</td>
                                        <td class="p-8 text-center">
                                            <span class="px-4 py-1.5 rounded-full text-[10px] font-black uppercase ${p.stock < 10 ? 'bg-rose-50 text-rose-600' : 'bg-emerald-50 text-emerald-600'}">
                                                ${p.stock} piezas
                                            </span>
                                        </td>
                                        <td class="p-8 text-right">
                                            <div class="flex justify-end gap-3">
                                                <button onclick="app.openProductModal(${p.id})" class="p-3 bg-slate-50 rounded-xl text-slate-400 hover:text-emerald-600 hover:bg-emerald-50 transition-all"><i data-lucide="edit" class="w-4 h-4"></i></button>
                                                <button onclick="app.deleteProd(${p.id})" class="p-3 bg-slate-50 rounded-xl text-slate-400 hover:text-rose-600 hover:bg-rose-50 transition-all"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                                            </div>
                                        </td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                `;
            },

            openProductModal(id = null) {
                const prods = DB.get(DB.KEYS.PRODUCTS);
                const p = id ? prods.find(x => x.id === id) : { name: '', price: '', stock: '', icon: 'package' };
                const modal = document.getElementById('modal-overlay');
                modal.classList.remove('hidden');
                document.getElementById('modal-content').innerHTML = `
                    <form onsubmit="app.saveProd(event, ${id})" class="p-10 space-y-6">
                        <h2 class="text-2xl font-black text-slate-800 tracking-tight">${id ? 'Editar' : 'Nuevo'} Producto</h2>
                        <div>
                            <label class="block text-xs font-black text-slate-400 uppercase tracking-widest mb-2">Nombre</label>
                            <input type="text" name="name" value="${p.name}" required class="w-full p-4 bg-slate-50 rounded-2xl border-none outline-none focus:ring-2 focus:ring-emerald-500 font-bold">
                        </div>
                        <div class="grid grid-cols-2 gap-6">
                            <div>
                                <label class="block text-xs font-black text-slate-400 uppercase tracking-widest mb-2">Precio ($)</label>
                                <input type="number" step="0.5" name="price" value="${p.price}" required class="w-full p-4 bg-slate-50 rounded-2xl border-none outline-none focus:ring-2 focus:ring-emerald-500 font-bold">
                            </div>
                            <div>
                                <label class="block text-xs font-black text-slate-400 uppercase tracking-widest mb-2">Stock</label>
                                <input type="number" name="stock" value="${p.stock}" required class="w-full p-4 bg-slate-50 rounded-2xl border-none outline-none focus:ring-2 focus:ring-emerald-500 font-bold">
                            </div>
                        </div>
                        <div class="flex gap-4 pt-4">
                            <button type="button" onclick="app.closeModal()" class="flex-1 py-4 font-black text-slate-400">Cancelar</button>
                            <button type="submit" class="flex-[2] bg-emerald-600 text-white py-4 rounded-2xl font-black shadow-xl shadow-emerald-100 hover:bg-emerald-700 transition-all">Guardar</button>
                        </div>
                    </form>
                `;
                lucide.createIcons();
            },

            saveProd(e, id) {
                e.preventDefault();
                const f = new FormData(e.target);
                const prods = DB.get(DB.KEYS.PRODUCTS);
                const data = {
                    id: id || Date.now(),
                    name: f.get('name'),
                    price: parseFloat(f.get('price')),
                    stock: parseInt(f.get('stock')),
                    icon: 'package'
                };
                if (id) {
                    const idx = prods.findIndex(x => x.id === id);
                    prods[idx] = data;
                } else {
                    prods.push(data);
                }
                DB.save(DB.KEYS.PRODUCTS, prods);
                this.closeModal();
                this.showView('inventory');
            },

            deleteProd(id) {
                if (!confirm('¿Eliminar producto?')) return;
                const filtered = DB.get(DB.KEYS.PRODUCTS).filter(x => x.id !== id);
                DB.save(DB.KEYS.PRODUCTS, filtered);
                this.showView('inventory');
            },

            // --- VISTA REPORTES ---
            renderReports(container) {
                const sales = DB.get(DB.KEYS.SALES);
                const total = sales.reduce((s, x) => s + x.total, 0);
                container.innerHTML = `
                    <div class="mb-10">
                        <h2 class="text-4xl font-extrabold text-slate-900 tracking-tight">Corte de Caja</h2>
                        <p class="text-slate-500 mt-2 font-medium">Resumen financiero del día.</p>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-8 mb-10">
                        <div class="bg-emerald-600 p-10 rounded-[3rem] text-white shadow-2xl shadow-emerald-200 flex flex-col justify-center">
                            <span class="text-xs font-black uppercase opacity-50 tracking-[0.2em]">Venta Total</span>
                            <div class="text-6xl font-black mt-2 leading-none">$${total.toFixed(2)}</div>
                            <p class="mt-6 text-sm font-bold opacity-80 flex items-center gap-2">
                                <i data-lucide="check-circle" class="w-4 h-4"></i> ${sales.length} transacciones procesadas
                            </p>
                        </div>
                        <div class="bg-white p-10 rounded-[3rem] border border-slate-100 shadow-sm flex flex-col justify-center text-center">
                             <div class="flex justify-center gap-4 mb-4">
                                <i data-lucide="zap" class="w-10 h-10 text-emerald-500 fill-emerald-500"></i>
                                <i data-lucide="award" class="w-10 h-10 text-amber-400 fill-amber-400"></i>
                             </div>
                             <p class="text-slate-400 font-bold uppercase text-xs tracking-widest italic">¡Excelente día de ventas!</p>
                        </div>
                    </div>

                    <div class="bg-white rounded-[3rem] border border-slate-100 overflow-hidden shadow-sm">
                        <div class="p-8 border-b bg-slate-50/50">
                            <h3 class="font-black text-slate-800 text-xs uppercase tracking-widest">Historial Reciente</h3>
                        </div>
                        <div class="divide-y divide-slate-50">
                            ${sales.length === 0 ? '<p class="p-10 text-center text-slate-300 font-bold italic">No hay ventas registradas</p>' :
                        sales.slice().reverse().map(s => `
                                    <div class="p-8 flex justify-between items-center hover:bg-slate-50/30 transition-all">
                                        <div>
                                            <p class="font-black text-slate-800">Venta #${s.id.toString().slice(-4)}</p>
                                            <p class="text-xs font-bold text-slate-400 uppercase tracking-tighter">${new Date(s.date).toLocaleTimeString()}</p>
                                        </div>
                                        <div class="text-right">
                                            <p class="text-2xl font-black text-emerald-600">$${s.total.toFixed(2)}</p>
                                            <p class="text-[10px] text-slate-300 font-black uppercase tracking-widest">${s.items.length} Artículos</p>
                                        </div>
                                    </div>
                                `).join('')
                    }
                        </div>
                    </div>
                `;
            },

            filterPOS(q) {
                const grid = document.getElementById('pos-grid');
                const products = DB.get(DB.KEYS.PRODUCTS);
                const filtered = products.filter(p => p.name.toLowerCase().includes(q.toLowerCase()));
                grid.innerHTML = this.renderGrid(filtered);
                lucide.createIcons();
            },

            reset() { if (confirm('¿Cerrar caja y salir?')) location.reload(); }
        };

        window.onload = () => app.init();
    </script>
</body>

</html>
