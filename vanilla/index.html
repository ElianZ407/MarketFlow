<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - MarketFlow</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons (via unpkg for vanilla) -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md">
        <div class="flex justify-center mb-6 text-green-600">
            <i data-lucide="shopping-bag" class="w-12 h-12"></i>
        </div>
        <h2 class="text-2xl font-bold text-center mb-6 text-gray-800">Iniciar Sesión</h2>

        <div id="errorMsg" class="hidden bg-red-100 text-red-600 p-3 rounded-lg mb-4 text-sm"></div>

        <form id="loginForm" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                <input type="email" id="email" required
                    class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-green-500 focus:border-green-500 outline-none transition"
                    value="admin@market.com">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Contraseña</label>
                <input type="password" id="password" required
                    class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-green-500 focus:border-green-500 outline-none transition"
                    value="admin">
            </div>
            <button type="submit"
                class="w-full bg-green-600 text-white py-3 rounded-lg font-semibold hover:bg-green-700 transition">
                Ingresar
            </button>
        </form>

        <div class="mt-6 text-center text-sm text-gray-600">
            ¿No tienes cuenta? <a href="#" onclick="alert('Funcionalidad de registro no implementada en demo')"
                class="text-green-600 hover:underline font-medium">Regístrate</a>
        </div>
    </div>

    <script src="js/db.js"></script>
    <script src="js/auth.js"></script>
    <script>
        // Init Icons
        lucide.createIcons();

        // Check if already logged in
        if (Auth.getUser()) {
            window.location.href = 'pos.html';
        }

        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('errorMsg');

            if (Auth.login(email, password)) {
                window.location.href = 'pos.html';
            } else {
                errorDiv.textContent = 'Credenciales incorrectas';
                errorDiv.classList.remove('hidden');
            }
        });
    </script>
</body>

</html>
