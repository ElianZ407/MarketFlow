<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario - MarketFlow</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>

    <div class="main-content">

        <div class="flex justify-between items-center mb-6">
            <h2 class="text-2xl font-bold text-gray-800">Inventario</h2>
            <button onclick="inventory.openModal()"
                class="bg-green-600 text-white px-4 py-2 rounded-lg flex items-center gap-2 hover:bg-green-700 shadow-sm">
                <i data-lucide="plus" class="w-5 h-5"></i> <span class="hidden sm:inline">Nuevo Producto</span>
            </button>
        </div>

        <div class="bg-white rounded-xl shadow-sm border p-4 mb-6">
            <div class="flex items-center gap-2 border rounded-lg px-3 py-2">
                <i data-lucide="search" class="text-gray-400 w-5 h-5"></i>
                <input id="searchInput" placeholder="Buscar productos..." class="flex-1 outline-none text-gray-700" />
            </div>
        </div>

        <div id="productGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
            <!-- Products injected here -->
        </div>

    </div>

    <!-- Modal -->
    <div id="productModal"
        class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-xl shadow-xl w-full max-w-md p-6">
            <h2 id="modalTitle" class="text-xl font-bold mb-4">Nuevo Producto</h2>

            <form id="productForm" class="space-y-4">
                <input type="hidden" id="prodId">

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Nombre</label>
                    <input type="text" id="prodName" required
                        class="w-full px-3 py-2 border rounded-lg focus:ring-green-500 focus:border-green-500 outline-none">
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Precio</label>
                        <input type="number" id="prodPrice" step="0.50" required
                            class="w-full px-3 py-2 border rounded-lg focus:ring-green-500 focus:border-green-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Stock</label>
                        <input type="number" id="prodStock" required
                            class="w-full px-3 py-2 border rounded-lg focus:ring-green-500 focus:border-green-500 outline-none">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Categoría</label>
                    <input type="text" id="prodCategory"
                        class="w-full px-3 py-2 border rounded-lg focus:ring-green-500 focus:border-green-500 outline-none">
                </div>

                <div class="flex justify-end gap-2 mt-6">
                    <button type="button" onclick="inventory.closeModal()"
                        class="px-4 py-2 text-gray-700 bg-gray-100 rounded-lg hover:bg-gray-200">Cancelar</button>
                    <button type="submit"
                        class="px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/db.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/inventory.js"></script>
    <script>
        Auth.checkAuth();
    </script>
</body>

</html>
