<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POS - MarketFlow</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>

    <!-- Main Content wrapper for Layout.js -->
    <div class="main-content">

        <div class="flex flex-col md:flex-row gap-6 h-[calc(100vh-100px)]">
            <!-- Left: Product Grid -->
            <div class="flex-1 flex flex-col overflow-hidden">
                <div class="bg-white p-4 rounded-xl shadow-sm border mb-4">
                    <div class="flex items-center gap-2 border rounded-lg px-3 py-2 bg-gray-50">
                        <i data-lucide="search" class="text-gray-400 w-5 h-5"></i>
                        <input id="searchInput" placeholder="Buscar producto a vender..."
                            class="flex-1 outline-none bg-transparent" autofocus />
                    </div>
                </div>

                <div class="flex-1 overflow-y-auto pr-2 custom-scroll">
                    <div id="productGrid" class="grid grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
                        <!-- Products Injected Here -->
                    </div>
                </div>
            </div>

            <!-- Right: Cart -->
            <div class="w-full md:w-96 bg-white rounded-xl shadow-lg border flex flex-col h-full">
                <div class="p-4 border-b bg-green-50 rounded-t-xl">
                    <h2 class="font-bold text-lg flex items-center gap-2 text-green-800">
                        <i data-lucide="shopping-cart" class="w-5 h-5"></i> Carrito Actual
                    </h2>
                </div>

                <div id="cartItems" class="flex-1 overflow-y-auto p-4 space-y-3">
                    <!-- Cart Items Injected Here -->
                </div>

                <div class="p-6 border-t bg-gray-50 rounded-b-xl">
                    <div class="flex justify-between items-center mb-6">
                        <span class="text-gray-600">Total a Pagar</span>
                        <span id="cartTotal" class="text-3xl font-bold text-gray-900">$0.00</span>
                    </div>

                    <div class="grid grid-cols-2 gap-2 mb-4">
                        <button onclick="pos.setPaymentMethod('Efectivo')"
                            class="payment-btn flex justify-center py-2 rounded border bg-green-600 text-white border-green-600"
                            data-method="Efectivo">Efectivo</button>
                        <button onclick="pos.setPaymentMethod('Tarjeta')"
                            class="payment-btn flex justify-center py-2 rounded border bg-white text-gray-700 hover:bg-gray-100"
                            data-method="Tarjeta">Tarjeta</button>
                    </div>

                    <div class="mb-4">
                        <input type="number" id="cashGiven" class="w-full px-3 py-2 border rounded"
                            placeholder="Efectivo recibido" onkeyup="pos.calculateChange()">
                        <div class="flex justify-between text-sm text-gray-500 mt-1">
                            <span>Cambio:</span>
                            <span id="changeDisplay">$0.00</span>
                        </div>
                    </div>

                    <button onclick="pos.checkout()"
                        class="w-full bg-green-600 text-white py-4 rounded-xl font-bold text-lg hover:bg-green-700 transition shadow-lg shadow-green-200">
                        Confirmar Venta
                    </button>
                </div>
            </div>
        </div>

    </div>

    <!-- Hidden Ticket Print Area -->
    <div id="ticket-print-area" class="hidden print:block"></div>

    <script src="js/db.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/pos.js"></script>
    <script>
        Auth.checkAuth();
        // Override pos.js render functions to use Tailwind classes
        // (Modifying pos.js directly is better, but this confirms the pattern)
    </script>
</body>

</html>
