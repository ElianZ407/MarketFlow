<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reportes - MarketFlow</title>
    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

    <div class="main-content">
        <h1 class="text-3xl font-bold mb-8 text-gray-800">Panel de Ventas</h1>

        <!-- Stats Cards -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-8 mb-8">
            <div class="bg-white p-6 rounded-lg shadow-md">
                <h3 class="text-gray-500 text-sm font-bold uppercase">Ventas de Hoy</h3>
                <p class="text-3xl font-bold text-green-600 mt-2" id="todaySales">$0.00</p>
            </div>
            <div class="bg-white p-6 rounded-lg shadow-md">
                <h3 class="text-gray-500 text-sm font-bold uppercase">Total Productos</h3>
                <p class="text-3xl font-bold text-blue-600 mt-2" id="totalItems">0</p>
            </div>
            <div class="bg-white p-6 rounded-lg shadow-md">
                <h3 class="text-gray-500 text-sm font-bold uppercase">Ticket Promedio</h3>
                <p class="text-3xl font-bold text-gray-800 mt-2" id="avgTicket">$0.00</p>
            </div>
        </div>

        <!-- Charts -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-8 mb-8">
            <div class="bg-white p-6 rounded-lg shadow-md">
                <h2 class="text-xl font-semibold mb-4">Ventas Diarias (Últimos 7 días)</h2>
                <div class="h-[300px]">
                    <canvas id="dailyChart"></canvas>
                </div>
            </div>
            <div class="bg-white p-6 rounded-lg shadow-md">
                <h2 class="text-xl font-semibold mb-4">Métodos de Pago</h2>
                <div class="h-[300px] flex justify-center">
                    <canvas id="paymentChart"></canvas>
                </div>
            </div>
        </div>

        <!-- Top Products -->
        <div class="bg-white p-6 rounded-lg shadow-md">
            <h2 class="text-xl font-semibold mb-4">Top 5 Productos Más Vendidos</h2>
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                Producto</th>
                            <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">
                                Cantidad Vendida</th>
                            <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">
                                Total Generado</th>
                        </tr>
                    </thead>
                    <tbody id="topProductsBody" class="bg-white divide-y divide-gray-200">
                        <!-- Rows injected here -->
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <script src="js/db.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/dashboard.js"></script>
    <script>
        Auth.checkAuth();
    </script>
</body>

</html>
